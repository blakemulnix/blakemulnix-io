# The Outside Work section. Photo collections are separate: they are managed
# through the add-photos tool and photos/manifest.json, not here.

# Set large, and read as one block rather than separate paragraphs. The bike
# tire line belongs here, next to the handlebars it is the punchline to, and
# at the size everybody actually reads.
lede:
  - I charge up my mental batteries by depleting my glycogen stores. Much of that
    takes place behind my handlebars. Avoid bringing up bike tires around me if you
    don't have the next 20 minutes free.

# Body-size paragraphs under the lede. Only the first shows before the fade,
# so it opens on the camera: the photo collections are the next thing on the
# page, and the moose lands right as the text trails off.
body:
  - I always build enough time into a road trip to take the less traveled route. I
    bring my camera just about everywhere, and I am saving up for the telephoto lens
    that will finally let me get a decent picture of a moose without putting my life
    at risk.
  - I'm undoubtedly hooked on gravel biking at this point, but I still love a long walk up
    a steep trail. Skiing has gotten too darn expensive lately, but I go when I
    can.
  - I hunt and fish with my dad and brother. Iowa's trophy whitetail deer
    population is thriving, but sadly I can't say the same for the fish in our
    rivers. Lucky for us, there are ten thousand lakes not too far north.
  - I recently bought a century home (built in 1918). It has the tiniest yard that I population
    to fill with native plants. I refuse to own a mower again. Giving the house the attention it
    has gone far too long without has been more rewarding than I expected.
  # Double quoted, not single: inside a single quoted scalar an apostrophe
  # has to be doubled, so "haven't" ended the string early.
  - "There is a big spot in my brain reserved for the lyrics and melodies of
    singer songwriters, especially ones with objectively imperfect voices:
    Adrianne Lenker (of Big Thief), John Prine, Neil Young, Joni Mitchell, David Byrne,
    and Colter Wall get a lot of play time. Oh, and if you haven't heard Khruangbin yet,
    do yourself a favor and go listen."
  - 'I host for family and friends. We play board games and classic midwestern card
    games. House rules: no table talk during euchre. I cook from scratch as much as I
    can, and I like to think I have gotten pretty good at pressure cooker carnitas,
    pastas, and soups. There is a gas grill out back I still need to practice on when
    I get my patio completed.'
  - And of course, coffee. I recently acquired an AeroPress and enjoy iterating on my
    technique. My beverage of choice is an Irish red ale, or a paloma with mezcal (yes,
    the kind with the worm is best).

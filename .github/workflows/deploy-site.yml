name: Deploy site

# Content-only deploys. Infrastructure is handled by deploy-infra.yml so that
# editing a paragraph does not trigger a CloudFormation deployment.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**/*.md'
      - 'diagrams/**'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required to request the GitHub OIDC token.

env:
  AWS_REGION: us-east-1
  STACK_NAME: Site

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve stack outputs
        id: stack
        run: |
          set -euo pipefail
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json)

          bucket=$(jq -r '.[] | select(.OutputKey == "SiteBucketName") | .OutputValue' <<<"$outputs")
          distribution=$(jq -r '.[] | select(.OutputKey == "DistributionId") | .OutputValue' <<<"$outputs")

          if [[ -z "$bucket" || -z "$distribution" || "$bucket" == "null" || "$distribution" == "null" ]]; then
            echo "::error::Could not resolve bucket or distribution from stack '$STACK_NAME'." \
                 "Deploy the infrastructure first."
            exit 1
          fi

          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution=$distribution" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail
          # Bundles carry a content hash in their filename, so they can be
          # cached indefinitely. --delete is scoped by the same filters, so
          # each pass only prunes within the paths it manages.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public,max-age=31536000,immutable'

          # Unhashed files (index.html, favicon, robots, sitemap, PDF, photo)
          # must be revalidated so a deploy is visible immediately.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude 'assets/*' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          set -euo pipefail
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation $invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" --id "$invalidation"

      - name: Summary
        run: echo "Published https://blakemulnix.io" >> "$GITHUB_STEP_SUMMARY"

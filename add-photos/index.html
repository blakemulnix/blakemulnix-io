<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add photos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --ink: #101512;
        --pine: #141d17;
        --sand: #e7dcc4;
        --muted: #c9bfa6;
        --moss: #93b06e;
        --ochre: #d9a05b;
        --rust: #d4795c;
        --stone: #8fb0c0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0 0 6rem;
        background: var(--ink);
        color: var(--sand);
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
        padding: 1rem clamp(1rem, 4vw, 2.5rem);
        background: color-mix(in srgb, var(--pine) 88%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid #ffffff14;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .count b {
        color: var(--ochre);
      }
      .count i {
        font-style: normal;
        color: var(--stone);
      }
      .spacer {
        flex: 1;
      }
      .status {
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        min-width: 7rem;
        text-align: right;
      }
      .status[data-state='saved'] {
        color: var(--moss);
      }
      .status[data-state='error'] {
        color: var(--rust);
      }
      button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        border: 1px solid #ffffff2b;
        background: #ffffff12;
        color: var(--sand);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #ffffff1f;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label.filter {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.85rem;
        color: var(--muted);
        cursor: pointer;
      }
      main {
        padding: clamp(1rem, 4vw, 2.5rem);
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* ── A collection ─────────────────────────────────────────────────── */
      .group {
        border: 1px solid #ffffff14;
        border-radius: 14px;
        background: #ffffff06;
      }
      .group.unfiled {
        border-color: color-mix(in srgb, var(--ochre) 40%, transparent);
        background: color-mix(in srgb, var(--ochre) 6%, transparent);
      }
      .group.over {
        border-color: var(--moss);
        box-shadow: 0 0 0 1px var(--moss);
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid #ffffff12;
      }
      .group-head input.title {
        flex: 1;
        min-width: 8rem;
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        background: transparent;
        border-color: transparent;
      }
      .group-head input.title:hover {
        border-color: #ffffff1f;
      }
      .group-name {
        flex: 1;
        font-size: 1rem;
        font-weight: 600;
      }
      .group-count {
        font:
          0.7rem ui-monospace,
          monospace;
        color: #ffffff5c;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .group-tools {
        display: flex;
        gap: 0.3rem;
      }
      .group-tools button {
        padding: 0.25rem 0.55rem;
        font-size: 0.75rem;
        border-radius: 7px;
      }
      .group-tools button.danger:hover {
        border-color: var(--rust);
        color: var(--rust);
      }
      .cards {
        display: grid;
        gap: 1rem;
        /* Wide enough for a location to be readable while typing it: at 320
           the input clipped mid-word and every card looked half filled. */
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        padding: 1rem;
        min-height: 5.5rem;
      }
      .cards:empty::after {
        content: 'Drag photos here';
        color: #ffffff3d;
        font-size: 0.85rem;
        grid-column: 1 / -1;
        align-self: center;
        text-align: center;
      }

      /* ── A photo ──────────────────────────────────────────────────────── */
      .card {
        position: relative;
        display: flex;
        gap: 0.9rem;
        padding: 0.75rem;
        border: 1px solid #ffffff14;
        border-radius: 12px;
        background: #ffffff08;
      }
      .card[data-done='false'] {
        border-color: color-mix(in srgb, var(--ochre) 45%, transparent);
      }
      .card img {
        width: 108px;
        height: 108px;
        flex: none;
        object-fit: cover;
        border-radius: 8px;
        background: #ffffff0f;
      }
      .cover-badge {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        padding: 0.1rem 0.35rem;
        border-radius: 5px;
        background: color-mix(in srgb, var(--moss) 85%, black);
        color: #0d1410;
        font:
          600 0.6rem ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
        flex: 1;
      }
      .slug {
        font:
          600 0.8rem/1.2 ui-monospace,
          monospace;
        color: var(--moss);
      }
      .file {
        font:
          0.7rem/1.3 ui-monospace,
          monospace;
        color: #ffffff5c;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      input,
      select {
        width: 100%;
        padding: 0.5rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
        color: var(--sand);
        background: #00000038;
        border: 1px solid #ffffff1f;
        border-radius: 7px;
      }
      input.location {
        margin-top: auto;
      }
      select {
        font-size: 0.78rem;
        color: var(--muted);
        cursor: pointer;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--moss);
        outline-offset: 1px;
      }
      .card[draggable='true'] {
        cursor: grab;
      }
      .card.dragging {
        opacity: 0.35;
        cursor: grabbing;
      }
      .card.over {
        border-color: var(--moss);
        box-shadow: 0 0 0 1px var(--moss);
      }
      .handle {
        display: flex;
        flex: none;
        align-items: center;
        padding: 0 0.1rem;
        color: #ffffff47;
        font-size: 1rem;
        line-height: 1;
        user-select: none;
      }
      .nudge {
        display: flex;
        flex: none;
        flex-direction: column;
        justify-content: center;
        gap: 0.2rem;
      }
      .nudge button {
        padding: 0.1rem 0.3rem;
        font-size: 0.7rem;
        line-height: 1.2;
        border-radius: 5px;
      }
      .pos {
        font:
          0.65rem ui-monospace,
          monospace;
        color: #ffffff47;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        padding: 3rem;
        text-align: center;
        color: var(--muted);
      }
      kbd {
        font:
          0.75rem ui-monospace,
          monospace;
        padding: 0.1rem 0.35rem;
        border: 1px solid #ffffff2b;
        border-radius: 4px;
      }
      .hint {
        padding: 0 clamp(1rem, 4vw, 2.5rem);
        color: #ffffff5c;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Photos</h1>
      <span class="count" id="count"></span>
      <label class="filter"><input type="checkbox" id="only" style="width: auto; margin: 0" /> Only unlabelled</label>
      <button id="new-collection">New collection</button>
      <span class="spacer"></span>
      <span class="status" id="status"></span>
      <button id="save">Save and rebuild</button>
    </header>

    <p class="hint">
      Everything saves as you type. Drag a photo between collections to move it, or use its dropdown. The first photo in
      a collection is its cover. <kbd>Enter</kbd> jumps to the next unlabelled photo. Hit <em>Save and rebuild</em>
      when you are done to regenerate the site's photo data.
    </p>

    <main id="groups"></main>

    <script>
      const groupsEl = document.getElementById('groups')
      const status = document.getElementById('status')
      const countEl = document.getElementById('count')
      const onlyEl = document.getElementById('only')
      const saveBtn = document.getElementById('save')
      const newBtn = document.getElementById('new-collection')

      /** The manifest, held as the page's own state and written back whole. */
      let photos = []
      let collections = []

      /** Photos with no collection, or one that no longer exists. */
      const UNFILED = ''

      const setStatus = (text, state = '') => {
        status.textContent = text
        status.dataset.state = state
      }

      const groupOf = (photo) => (collections.some((c) => c.id === photo.collection) ? photo.collection : UNFILED)

      const inGroup = (id) => photos.filter((photo) => groupOf(photo) === id)

      const updateCount = () => {
        const unlabelled = photos.filter((p) => !p.location?.trim()).length
        const unfiled = inGroup(UNFILED).length
        countEl.innerHTML = [
          unlabelled ? `<b>${unlabelled}</b> need a location` : `all ${photos.length} labelled`,
          unfiled ? `<i>${unfiled}</i> unfiled` : null,
        ]
          .filter(Boolean)
          .join(' · ')
      }

      /**
       * An id from a title: stable, readable in the manifest, and unique.
       * Ids are the join key with the photos, so they are assigned once here
       * and never derived again when the title is edited.
       */
      const makeId = (title) => {
        const base =
          title
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '') || 'collection'
        let id = base
        for (let n = 2; collections.some((c) => c.id === id); n++) id = `${base}-${n}`
        return id
      }

      /**
       * The manifest's photo order is the order the site shows them, so the
       * page keeps the array grouped: every collection's photos contiguous,
       * collections in their own order, unfiled at the end. Reordering a
       * group is then just a splice within its run.
       */
      const regroup = () => {
        const order = [...collections.map((c) => c.id), UNFILED]
        photos = order.flatMap((id) => inGroup(id))
      }

      const card = (photo, index, groupId) => {
        const el = document.createElement('div')
        el.className = 'card'
        el.dataset.done = Boolean(photo.location?.trim())
        el.dataset.file = photo.file
        el.dataset.group = groupId
        // Dragging only makes sense against the full list; with the filter on,
        // the hidden cards would make a drop position a guess.
        el.draggable = !onlyEl.checked

        const handle = document.createElement('div')
        handle.className = 'handle'
        handle.textContent = onlyEl.checked ? '' : '⠿'
        handle.title = 'Drag to reorder, or to another collection'

        const img = document.createElement('img')
        img.src = `/photos/${photo.slug}-400.webp`
        img.loading = 'lazy'
        img.alt = photo.slug

        if (index === 0 && groupId !== UNFILED) {
          const badge = document.createElement('span')
          badge.className = 'cover-badge'
          badge.textContent = 'Cover'
          el.append(badge)
        }

        const meta = document.createElement('div')
        meta.className = 'meta'

        const slug = document.createElement('div')
        slug.className = 'slug'
        slug.textContent = photo.slug
        const position = document.createElement('span')
        position.className = 'pos'
        position.textContent = ` #${index + 1}`
        slug.append(position)

        const file = document.createElement('div')
        file.className = 'file'
        file.textContent = `${photo.file} · ${photo.width}×${photo.height}`

        const location = document.createElement('input')
        location.className = 'location'
        location.value = photo.location ?? ''
        location.placeholder = 'Location, e.g. Maroon Bells, Colorado'
        location.addEventListener('input', () => {
          photo.location = location.value
          el.dataset.done = Boolean(location.value.trim())
          updateCount()
          queueSave()
        })
        location.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return
          e.preventDefault()
          const inputs = [...groupsEl.querySelectorAll('input.location')]
          const next = inputs.slice(inputs.indexOf(location) + 1).find((i) => !i.value.trim())
          ;(next ?? inputs[inputs.indexOf(location) + 1])?.focus()
        })

        // The same move as dragging, for anyone not dragging.
        const picker = document.createElement('select')
        for (const option of [{ id: UNFILED, title: 'Unfiled' }, ...collections]) {
          const opt = document.createElement('option')
          opt.value = option.id
          opt.textContent = option.title || option.id
          opt.selected = option.id === groupId
          picker.append(opt)
        }
        picker.addEventListener('change', () => {
          photo.collection = picker.value
          regroup()
          render()
          queueSave()
        })

        meta.append(slug, file, picker, location)

        const nudge = document.createElement('div')
        nudge.className = 'nudge'
        for (const [label, delta] of [
          ['↑', -1],
          ['↓', 1],
        ]) {
          const button = document.createElement('button')
          button.type = 'button'
          button.textContent = label
          button.title = delta < 0 ? 'Move earlier' : 'Move later'
          button.addEventListener('click', () => move(photo.file, delta))
          nudge.append(button)
        }

        el.append(handle, img, meta)
        if (!onlyEl.checked) el.append(nudge)
        return el
      }

      const groupSection = (collection, index) => {
        const id = collection?.id ?? UNFILED
        const section = document.createElement('section')
        section.className = `group${id === UNFILED ? ' unfiled' : ''}`
        section.dataset.group = id

        const head = document.createElement('div')
        head.className = 'group-head'

        if (collection) {
          const title = document.createElement('input')
          title.className = 'title'
          title.value = collection.title
          title.placeholder = 'Collection name'
          title.addEventListener('input', () => {
            collection.title = title.value
            // The dropdowns on every card name this collection too.
            for (const option of groupsEl.querySelectorAll(`option[value="${collection.id}"]`)) {
              option.textContent = title.value || collection.id
            }
            queueSave()
          })
          head.append(title)
        } else {
          const name = document.createElement('span')
          name.className = 'group-name'
          name.textContent = 'Unfiled'
          head.append(name)
        }

        const members = inGroup(id)
        const count = document.createElement('span')
        count.className = 'group-count'
        count.textContent = `${members.length} photo${members.length === 1 ? '' : 's'}`
        head.append(count)

        if (collection) {
          const tools = document.createElement('div')
          tools.className = 'group-tools'
          for (const [label, delta] of [
            ['↑', -1],
            ['↓', 1],
          ]) {
            const button = document.createElement('button')
            button.type = 'button'
            button.textContent = label
            button.title = delta < 0 ? 'Move collection up' : 'Move collection down'
            button.disabled = index + delta < 0 || index + delta >= collections.length
            button.addEventListener('click', () => moveCollection(collection.id, delta))
            tools.append(button)
          }
          const remove = document.createElement('button')
          remove.type = 'button'
          remove.className = 'danger'
          remove.textContent = 'Delete'
          remove.title = 'Delete the collection. Its photos become unfiled.'
          remove.addEventListener('click', () => deleteCollection(collection.id))
          tools.append(remove)
          head.append(tools)
        }

        const cards = document.createElement('div')
        cards.className = 'cards'
        const shown = onlyEl.checked ? members.filter((p) => !p.location?.trim()) : members
        shown.forEach((photo, i) => cards.append(card(photo, members.indexOf(photo), id)))

        section.append(head, cards)
        return section
      }

      const render = () => {
        groupsEl.innerHTML = ''
        collections.forEach((collection, index) => groupsEl.append(groupSection(collection, index)))
        // Unfiled sits last so the named collections are what you see first,
        // but it is always present as a drop target.
        groupsEl.append(groupSection(null, -1))
        updateCount()
      }

      const moveCollection = (id, delta) => {
        const from = collections.findIndex((c) => c.id === id)
        const to = from + delta
        if (from < 0 || to < 0 || to >= collections.length) return
        const [collection] = collections.splice(from, 1)
        collections.splice(to, 0, collection)
        regroup()
        render()
        queueSave()
      }

      const deleteCollection = (id) => {
        const members = inGroup(id)
        const collection = collections.find((c) => c.id === id)
        if (members.length && !confirm(`Delete "${collection.title}"? Its ${members.length} photos become unfiled.`)) {
          return
        }
        collections = collections.filter((c) => c.id !== id)
        for (const photo of members) photo.collection = UNFILED
        regroup()
        render()
        queueSave()
      }

      newBtn.addEventListener('click', () => {
        const title = prompt('Name the collection')?.trim()
        if (!title) return
        collections.push({ id: makeId(title), title })
        regroup()
        render()
        queueSave()
        // Straight to the new section, which is at the bottom of the named ones.
        groupsEl.querySelector(`[data-group="${collections.at(-1).id}"] input.title`)?.focus()
      })

      /** Moves one photo by `delta` places within its own collection. */
      const move = (file, delta) => {
        const photo = photos.find((p) => p.file === file)
        const members = inGroup(groupOf(photo))
        const at = members.indexOf(photo)
        const to = at + delta
        if (to < 0 || to >= members.length) return
        const from = photos.indexOf(photo)
        photos.splice(from, 1)
        photos.splice(photos.indexOf(members[to]) + (delta > 0 ? 1 : 0), 0, photo)
        render()
        queueSave()
      }

      /**
       * Drops `file` just before `beforeFile`, or at the end of `groupId` when
       * dropped on the section rather than on a card.
       */
      const moveTo = (file, groupId, beforeFile) => {
        const photo = photos.find((p) => p.file === file)
        if (!photo || file === beforeFile) return
        photo.collection = groupId
        photos.splice(photos.indexOf(photo), 1)
        const before = beforeFile ? photos.find((p) => p.file === beforeFile) : null
        if (before && groupOf(before) === groupId) photos.splice(photos.indexOf(before), 0, photo)
        else {
          const members = inGroup(groupId)
          const last = members.at(-1)
          photos.splice(last ? photos.indexOf(last) + 1 : photos.length, 0, photo)
        }
        regroup()
        render()
        queueSave()
      }

      /*
       * Edge scrolling while dragging.
       *
       * A collection is taller than the window and the browser does not scroll
       * the page for a drag of its own, so moving a photo from Canyon Country
       * to Early Rolls meant dropping it somewhere in between and dragging
       * again. Holding near the top or bottom edge now scrolls, faster the
       * closer to the edge, on a frame loop rather than per dragover event:
       * dragover only fires while the pointer moves, so a still pointer held
       * at the edge would otherwise scroll once and stop.
       */
      const EDGE = 110
      const MAX_SPEED = 24
      let pointerY = null
      let scrolling = null

      const edgeScroll = () => {
        if (pointerY === null) return stopScrolling()
        const top = pointerY - headerHeight()
        const bottom = innerHeight - pointerY
        let speed = 0
        if (top < EDGE) speed = -MAX_SPEED * Math.min(1, (EDGE - top) / EDGE)
        else if (bottom < EDGE) speed = MAX_SPEED * Math.min(1, (EDGE - bottom) / EDGE)
        if (speed) scrollBy(0, speed)
        scrolling = requestAnimationFrame(edgeScroll)
      }

      /** The sticky header covers the top of the window, so the zone starts under it. */
      const headerHeight = () => document.querySelector('header').offsetHeight

      const startScrolling = () => {
        if (scrolling === null) scrolling = requestAnimationFrame(edgeScroll)
      }
      const stopScrolling = () => {
        if (scrolling !== null) cancelAnimationFrame(scrolling)
        scrolling = null
        pointerY = null
      }

      let dragging = null
      groupsEl.addEventListener('dragstart', (e) => {
        const el = e.target.closest('.card')
        if (!el) return
        dragging = el.dataset.file
        el.classList.add('dragging')
        e.dataTransfer.effectAllowed = 'move'
        // Firefox refuses to start a drag with no payload.
        e.dataTransfer.setData('text/plain', dragging)
        startScrolling()
      })
      groupsEl.addEventListener('dragend', () => {
        dragging = null
        stopScrolling()
        for (const el of groupsEl.querySelectorAll('.card, .group')) el.classList.remove('dragging', 'over')
      })

      /*
       * On the document rather than the grid: the gaps between sections, and
       * the strip under the header, are not the grid, and letting the pointer
       * leave the drop target should not stop the page scrolling.
       */
      addEventListener('dragover', (e) => {
        if (!dragging) return
        e.preventDefault()
        pointerY = e.clientY
      })
      addEventListener('drop', () => stopScrolling())
      groupsEl.addEventListener('dragover', (e) => {
        if (!dragging) return
        e.preventDefault()
        e.dataTransfer.dropEffect = 'move'
        const el = e.target.closest('.card')
        const section = e.target.closest('.group')
        for (const other of groupsEl.querySelectorAll('.card')) other.classList.toggle('over', other === el)
        for (const other of groupsEl.querySelectorAll('.group')) other.classList.toggle('over', other === section)
      })
      groupsEl.addEventListener('drop', (e) => {
        if (!dragging) return
        e.preventDefault()
        const section = e.target.closest('.group')
        if (section) moveTo(dragging, section.dataset.group, e.target.closest('.card')?.dataset.file ?? null)
        dragging = null
      })

      // Debounced, so a burst of typing is one write rather than one per key.
      let timer
      let inFlight = false
      const queueSave = () => {
        setStatus('Saving…')
        clearTimeout(timer)
        timer = setTimeout(save, 500)
      }

      const save = async () => {
        if (inFlight) return queueSave()
        inFlight = true
        try {
          const res = await fetch('/api/photos', {
            method: 'PUT',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ photos, collections }),
          })
          if (!res.ok) throw new Error((await res.json()).error ?? res.statusText)
          const { changed, reordered, collectionsChanged } = await res.json()
          const what = [
            changed ? `${changed} edit${changed > 1 ? 's' : ''}` : null,
            reordered ? 'order' : null,
            collectionsChanged ? 'collections' : null,
          ]
            .filter(Boolean)
            .join(' + ')
          setStatus(what ? `Saved ${what}` : 'Saved', 'saved')
        } catch (error) {
          setStatus('Save failed', 'error')
          console.error(error)
        } finally {
          inFlight = false
        }
      }

      saveBtn.addEventListener('click', async () => {
        clearTimeout(timer)
        saveBtn.disabled = true
        setStatus('Saving…')
        await save()
        setStatus('Rebuilding…')
        try {
          const res = await fetch('/api/rebuild', { method: 'POST' })
          if (!res.ok) throw new Error((await res.json()).error ?? res.statusText)
          setStatus('Rebuilt', 'saved')
        } catch (error) {
          setStatus('Rebuild failed', 'error')
          console.error(error)
        } finally {
          saveBtn.disabled = false
        }
      })

      onlyEl.addEventListener('change', render)

      // Warn on the narrow window between a keystroke and its save landing.
      addEventListener('beforeunload', (e) => {
        if (timer && status.dataset.state !== 'saved') e.preventDefault()
      })

      const load = async () => {
        const manifest = await (await fetch('/api/photos')).json()
        photos = manifest.photos
        collections = manifest.collections ?? []
        regroup()
        render()
        setStatus('')
      }
      load()
    </script>
  </body>
</html>

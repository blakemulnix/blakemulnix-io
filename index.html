<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under the notch and the home
         indicator, which is as close to edge to edge as a browser tab gets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Added to a phone's home screen, the site opens with no browser chrome
         at all. A page in a normal tab cannot hide it without the Fullscreen
         API, which announces itself with a banner. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blake Mulnix" />

    <title>Blake Mulnix, Software Consultant</title>
    <meta
      name="description"
      content="Blake Mulnix is a software consultant helping teams build reliable, scalable software. Expertise in cloud architecture, infrastructure as code, GraphQL, front-end development, and deployment pipelines."
    />
    <meta name="author" content="Blake Mulnix" />
    <meta name="theme-color" content="#141d17" />
    <link rel="canonical" href="https://blakemulnix.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blakemulnix.io/" />
    <meta property="og:title" content="Blake Mulnix, Software Consultant" />
    <meta
      property="og:description"
      content="Blake Mulnix is a software consultant helping teams build reliable, scalable software. Expertise in cloud architecture, infrastructure as code, GraphQL, front-end development, and deployment pipelines."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
